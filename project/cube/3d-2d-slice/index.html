<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3D → 2D Plane Cube</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>3D → 2D Plane</h1>
          <p>1本の軸を捨てた「2次元世界」を、ガコンと切り替える</p>
        </div>
        <div class="center-badge">
          <span>中心</span>
          <strong id="centerLabel">D</strong>
        </div>
      </header>

      <section class="stage">
        <div
          id="world"
          class="world"
          aria-label="2次元的に表示したルービックキューブ"
        >
          <button class="face face-top" data-face="" aria-label="上面"></button>
          <button
            class="face face-left"
            data-face=""
            aria-label="左面"
          ></button>
          <button
            class="face face-center"
            data-face=""
            aria-label="中央面"
          ></button>
          <button
            class="face face-right"
            data-face=""
            aria-label="右面"
          ></button>
          <button
            class="face face-bottom"
            data-face=""
            aria-label="下面"
          ></button>
        </div>
      </section>

      <section class="control-panel">
        <div class="gacon-group">
          <button id="eButton" class="gacon-key" type="button">
            <kbd>E</kbd>
            <span>上下を保つ</span>
          </button>

          <div class="gacon-description">
            <strong>ガコン</strong>
            <small>中心となる2D世界を切り替える</small>
          </div>

          <button id="iButton" class="gacon-key" type="button">
            <kbd>I</kbd>
            <span>左右を保つ</span>
          </button>
        </div>

        <div class="help">
          <span><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> 左側の3面</span>
          <span><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> 右側の3面</span>
          <span>面をクリック：90°回転 / Shift+クリック：逆回転</span>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
