    <meta property="og:site_name" content="山近晴也 | Seiya Yamachika" />
    <meta property="og:title" content="3D Cube → 2D Projection | 山近晴也" />
    <meta property="og:description" content="3Dのキューブを2D Canvasへ投影し、視点の回転とキューブ操作を試せるインタラクティブデモです。" />

    <meta name="twitter:creator" content="@YamachikaSeiya" />
    <meta name="twitter:title" content="3D Cube → 2D Projection | 山近晴也" />
    <meta name="twitter:description" content="3Dのキューブを2D Canvasへ投影し、視点の回転とキューブ操作を試せるインタラクティブデモです。" />
    <meta name="twitter:image" content="https://yamachikaseiya.com/images/og-card.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <h1>3D Cube → 2D Projection</h1>
          <p>体対角線を軸に、1自由度だけで視点を回転させる試作</p>
        </div>
        <button id="resetView" class="secondary">視点をリセット</button>
      </header>

      <section class="stage-wrap">
        <div class="stage" id="stage">
          <canvas
            id="cubeCanvas"
            aria-label="2D投影された3Dルービックキューブ"
          ></canvas>
          <div class="drag-hint">左右へドラッグして視点を回転</div>
        </div>

        <aside class="panel">
          <div class="panel-block">
            <h2>視点</h2>
            <div class="readout">
              <span>回転角</span><strong id="angleReadout">0°</strong>
            </div>
            <input
              id="angleSlider"
              type="range"
              min="0"
              max="360"
              step="0.1"
              value="0"
              aria-label="視点の回転角"
            />
            <p class="note">
              カメラは立方体の体対角線を軸とした1次元の軌道上だけを移動します。縦方向のドラッグは無視します。
            </p>
          </div>

          <div class="panel-block">
            <h2>キューブ操作</h2>
            <div class="move-grid">
              <button class="move" data-move="L">S</button>
              <button class="move" data-move="F">D</button>
              <button class="move" data-move="R">F</button>
              <button class="move" data-move="B">J</button>
              <button class="move" data-move="D">K</button>
              <button class="move" data-move="U">L</button>
            </div>
            <p class="note">
              各ボタンは時計回り、Shiftキーを押しながらクリックすると反時計回りです。S
              / D / F は L / F / R 面、J / K / L は B / D / U
              面を操作します。Shift を加えると逆回転です。
            </p>
          </div>

          <div class="panel-block">
            <h2>表示</h2>
            <label class="toggle"
              ><input id="perspectiveToggle" type="checkbox" checked />
              透視投影</label
            >
            <label class="toggle"
              ><input id="axisToggle" type="checkbox" checked />
              体対角線軸を表示</label
            >
          </div>
        </aside>
      </section>

      <footer class="footer">
        <span
          >内部では3Dのキューブ状態を保持し、表示だけを2D
          Canvasへ投影しています。</span
        >
        <span id="fpsReadout"></span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
